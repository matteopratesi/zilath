server:
  port: 8081
  # Safe default: reachable only from this machine. Expose on the venue LAN explicitly
  # (ZILATH_GATE_BIND=0.0.0.0) and only behind the venue's own network: whoever can reach
  # these pages can record receipts, so the network IS the trust boundary.
  #
  # /gate/record requires Sec-Fetch-Site: same-origin, which stops a malicious page on the
  # door machine from submitting a form here. It does NOT stop anyone who can load the
  # pages themselves: for them the request IS same-origin. Widen the bind address and you
  # have given receipt-minting to everyone who can reach the port.
  address: ${ZILATH_GATE_BIND:127.0.0.1}

zilath:
  gate:
    # Shown on every page and stamped (as issuer) into each signed receipt.
    venue-name: ${ZILATH_GATE_VENUE:Teatro di Prova}
    # Entitlement types the operator can pick from, comma-separated. No free text
    # anywhere in the flow: free text is where personal data would leak in.
    entitlements: ${ZILATH_GATE_ENTITLEMENTS:Biglietto accompagnatore,Tariffa ridotta titolare,Accesso prioritario}
    # Where the signing key and the receipts file live. Keep it out of any backup
    # that leaves the venue.
    data-dir: ${ZILATH_GATE_DATA_DIR:./gate-data}
