name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, not to tags: a tag can be moved by whoever
      # controls, or compromises, the action's repository, and the next run would execute
      # different code under the same name. The comment names the release the SHA is; the
      # pins are those the v4 tags pointed at on 2026-09-25. Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Keeps the rule above true: a new step referring to an action by tag fails the build.
      - name: Refuse actions referenced by tag
        run: "! grep -hE '^ *-? *uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'"
      - run: ./gradlew build
