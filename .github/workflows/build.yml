name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs, not to tags: a tag can be moved by whoever
      # controls, or compromises, the action's repository, and the next run would execute
      # different code under the same name. The comment names the release the SHA is, and
      # each SHA is checked against that release's tag before it is merged. Dependabot
      # proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # Since v6, setup-gradle caches through a proprietary component by default, under
      # Gradle's own terms of use. The basic provider is the MIT-licensed one, built on
      # actions/cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Keeps the rule above true: a step referring to an action by anything but a full commit
      # SHA fails the build. The value of each uses: is checked, not the line, so a SHA in a
      # trailing comment does not excuse a tag. References to this repository need none:
      # ./path, and $/path, which GitHub resolves at the running commit and which must not
      # carry an @ref at all.
      - name: Refuse actions referenced by tag
        run: |
          unpinned="$(grep -hE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null \
            | sed -E 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//; s/[[:space:]]+#.*$//; s/^["'"'"']//; s/["'"'"']$//' \
            | grep -vE '^\./' | grep -vE '^\$/[^@[:space:]]+$' | grep -vE '^[^@[:space:]]+@[0-9a-f]{40}$' || true)"
          if [ -n "$unpinned" ]; then echo "actions not pinned to a full commit SHA:"; echo "$unpinned"; exit 1; fi
      - run: ./gradlew build
