# Update proposals only: nothing is merged without review. Pinned action SHAs are kept
# pinned (Dependabot rewrites the SHA and the version comment together).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
